<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Independiente</title>
<meta name="description" content="App del club Elite Independiente: categorías, partidos, entrenamientos, asistencia y pagos.">
<meta name="theme-color" content="#7A0012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elite Independiente">
<meta property="og:title" content="Elite Independiente">
<meta property="og:description" content="App del club: partidos, entrenamientos, asistencia y pagos.">
<meta property="og:image" content="https://igaviria0001-ops.github.io/elite-sport/assets/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>window.__bip=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;dispatchEvent(new Event('es-installable'))});addEventListener('appinstalled',function(){window.__bip=null});</script>
</head>
<body class="gated">
<header>
  <div class="brand">
    <div class="crest"><img src="assets/escudo.jpg" alt="Escudo Elite Independiente"></div>
    <div class="grow"><h1>ELITE INDEPENDIENTE</h1><div id="role" class="rolebadge"></div></div>
    <div id="me"></div>
  </div>
  <nav id="nav" aria-label="Secciones"></nav>
</header>
<main id="app"><div class="splash"><img src="assets/escudo.jpg" alt=""><div>Cargando…</div></div></main>
<noscript><p style="padding:20px;text-align:center">Elite Independiente necesita JavaScript activado.</p></noscript>
<script type="module" src="js/main.js"></script>
<script>
// Si la app no arranca en 15 s (por ejemplo, una actualización a medio descargar), ofrece repararla.
// Solo borra la copia de los archivos de la app: los datos y la sesión quedan intactos.
setTimeout(function () {
  if (window.__esBooted) return;
  var a = document.getElementById('app');
  a.innerHTML = '<div class="card" style="text-align:center;margin-top:30px"><div class="name">La app está tardando en abrir</div><div class="mute" style="margin:8px 0 14px">Revisa tu conexión. Si sigue así, toca reparar: no se borra nada tuyo.</div><button class="btn" id="fix">Reparar y recargar</button></div>';
  document.getElementById('fix').onclick = function () {
    var done = function () { location.reload(); };
    if (!window.caches) return done();
    caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^(elite-sport-|es-v\d)/.test(k); }).map(function (k) { return caches.delete(k); })); }).then(done, done);
  };
}, 15000);
</script>
</body>
</html>
